- id: L-10-11
  side: lower
  source_ids:
  - shapiro-2000
  source_locator: Theorem 12.21, p.245; Lemma 14.1, p.300
  operation: source restriction and Lam-Lam transfer
  inputs: []
  result:
    field: C
    r: 10
    s: 11
    lower: 17
  proof:
  - Restrict a putative [10,11,n] complex formula to (10,11), then orient it as (10,11).
  - Write its complex output as U+iV on real inputs. The identity gives ||U||^2-||V||^2=||x||^2||y||^2,
    so U is a nonsingular real bilinear map (Lemma 14.1).
  - 'Theorem 12.21 gives sigma(10,11)=17; sigma(10,11) <= 10 # 11 <= n.'
  parameters:
    theorem: sigma
    oriented_input_cell:
    - 10
    - 11
    sigma: 17
  kind: nonsingular-map obstruction
