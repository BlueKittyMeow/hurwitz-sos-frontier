- id: L-16-16
  side: lower
  source_ids:
  - shapiro-2000
  source_locator: Theorem 12.21, p.245; Lemma 14.1, p.300
  operation: source restriction and Lam-Lam transfer
  inputs: []
  result:
    field: C
    r: 16
    s: 16
    lower: 23
  proof:
  - Restrict a putative [16,16,n] complex formula to (11,16), then orient it as (11,16).
  - Write its complex output as U+iV on real inputs. The identity gives ||U||^2-||V||^2=||x||^2||y||^2,
    so U is a nonsingular real bilinear map (Lemma 14.1).
  - 'Theorem 12.21 gives sigma(11,16)=23; sigma(11,16) <= 11 # 16 <= n.'
  parameters:
    theorem: sigma
    oriented_input_cell:
    - 11
    - 16
    sigma: 23
  kind: nonsingular-map obstruction
