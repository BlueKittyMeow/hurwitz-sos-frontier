  operation: Lam-Lam transfer and explicit specialization
  inputs: []
  result:
    field: C
    r: 32
    s: 32
    lower: 48
  proof:
  - A complex formula gives a nonsingular real bilinear map by the Lam–Lam lemma. Projectivizing gives
    an axial map.
  - Its projective dimensions are (m,n,k)=(31,31,N-1). The exception analysis has n<=15; here n=31>=16.
  - Theorem (1.6) requires 31<2(N-32), hence N>=48.
  parameters:
    theorem: axial
    projective_sources:
    - 31
    - 31
  kind: axial-map obstruction
